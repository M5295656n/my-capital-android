name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK and unit tests
        run: gradle testDebugUnitTest assembleDebug
      - name: Run Room integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: gradle connectedDebugAndroidTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-capital-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
