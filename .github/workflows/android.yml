name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, fix/broker-zo-test-stable-2026-11-14, fix/dividend-forecast-record-date-2026-11-14, fix/dividend-history-partial-fetch-2026-11-14, feature/analytics-events-news, feature/payouts-sold-assets-analytics, feature/events-bond-rating-display, feature/sold-assets-in-portfolio, feature/issuer-logos-dividend-sector-fixes, feature/sector-details-remove-history-chart, fix/index-benchmark-cashflow-comparison, fix/index-benchmark-visual-separation, fix/benchmark-chart-and-return-history, fix/portfolio-return-match-benchmark-flow, feature/sold-assets-profit-index-periods-logos-2026-11-17, feature/mycapital-app-icon-2026-11-17, feature/target-portfolio-plan-2026-11-18, feature/operations-bottom-nav-redesign-2026-11-18, feature/home-dashboard-full-width-chart-2026-11-18, integration/mycapital-consolidation-2026-11-18, fix/market-history-board-routing-2026-11-18, refactor/codebase-audit-0.4.6-2026-11-18, fix/moex-gold-currency-quotes-2026-11-19, fix/restore-dashboard-gold-quote-2026-11-19, fix/gold-prevprice-fallback-2026-11-19, fix/portfolio-sector-domrf-lsngp-2026-11-19, fix/analytics-sector-money-decimal-comma-2026-11-19, feature/imoex-dashboard-chart-2026-11-19, feature/local-quote-history-2026-11-24, fix/dividend-forecast-dedup-2026-11-24 ]
    paths-ignore: [ 'docs/**' ]
  pull_request:
    branches: [ main, backup/stable-0.3.89-2026-11-14, fix/broker-zo-test-stable-2026-11-14, feature/sector-details-remove-history-chart, fix/index-benchmark-cashflow-comparison, fix/index-benchmark-visual-separation, fix/benchmark-chart-and-return-history, fix/dividend-history-partial-fetch-2026-11-14, integration/mycapital-consolidation-2026-11-18, fix/moex-gold-currency-quotes-2026-11-19, fix/restore-dashboard-gold-quote-2026-11-19, fix/gold-prevprice-fallback-2026-11-19, fix/portfolio-sector-domrf-lsngp-2026-11-19, feature/imoex-dashboard-chart-2026-11-19, feature/local-quote-history-2026-11-24 ]
    paths-ignore: [ 'docs/**' ]
  workflow_dispatch:

jobs:
  instrumented-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether Android instrumented tests are required
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: full instrumented suite enabled."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          elif [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "New branch push: run full instrumented suite."
            exit 0
          else
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > changed-files.txt
          fi

          cat changed-files.txt
          if grep -Eiq '(^app/src/androidTest/)|(^app/schemas/)|(^app/src/(main|test)/.*(Database|Dao|Migration|Repository|Backup|Restore|Import|BrokerReport|Portfolio).*[.](kt|java)$)|(^app/src/main/.*/(database|dao|migration|backup|restore|import)/)|(^build[.]gradle([.]kts)?$)|(^gradle/libs[.]versions[.]toml$)' changed-files.txt; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Data-layer or Android integration files changed: instrumented suite enabled."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No database/import/restore integration changes: instrumented suite skipped."
          fi

  instrumented-tests:
    needs: instrumented-filter
    if: needs.instrumented-filter.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for hardware-accelerated Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run Room and broker-account instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            READY=0; for attempt in $(seq 1 36); do BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"; ACTIVITY="$(adb shell service check activity 2>/dev/null || true)"; PACKAGE="$(adb shell service check package 2>/dev/null || true)"; if [ "$BOOT" = "1" ] && echo "$ACTIVITY" | grep -q found && echo "$PACKAGE" | grep -q found; then READY=1; break; fi; echo "Android framework services are not ready yet (attempt $attempt/36)."; sleep 5; done; if [ "$READY" -ne 1 ]; then echo "Android framework did not become healthy; collecting diagnostics."; adb shell getprop || true; adb shell service list || true; exit 1; fi; echo "Android framework is ready; starting instrumented tests."
            gradle connectedDebugAndroidTest --stacktrace
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify official MOEX NCA root CA
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/russian_trusted_root_ca.pem"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt" \
            --output "$CERT"
          ACTUAL="$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 | sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="D26D2D0231B7C39F92CC738512BA54103519E4405D68B5BD703E9788CA8ECF31"
          echo "MOEX NCA root SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || (echo "ERROR: Official NCA root fingerprint mismatch" && exit 1)
          openssl x509 -in "$CERT" -noout -subject -dates
          cat /etc/ssl/certs/ca-certificates.crt "$CERT" > "$RUNNER_TEMP/moex-ca-bundle.pem"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/moex-ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Verify live MOEX history for affected instruments
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          
          BASE = "https://iss.moex.com/iss"
          INSTRUMENTS = {
              "EQMX": ("shares", ["TQTF", "TQBR", "TQTD"]),
              "SBGD": ("shares", ["TQTF", "TQBR", "TQTD"]),
              "SBMM": ("shares", ["TQTF", "TQBR", "TQTD"]),
              "SU26244RMFS2": ("bonds", ["TQOB", "TQCB"]),
          }

          # TLS verification is intentionally strict. The official NCA root is
          # installed into the runner trust bundle in the preceding workflow step.

          def get_json(url):
              last_error = None
              for attempt in range(3):
                  try:
                      request = Request(url, headers={"Accept": "application/json", "User-Agent": "MyCapital-CI/1.0"})
                      with urlopen(request, timeout=20) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      last_error = exc
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              raise RuntimeError(f"ISS request failed: {url}: {last_error}")
          
          def verify_gold_cets_price():
              url = (f"{BASE}/engines/currency/markets/selt/boards/CETS/securities/GLDRUB_TOM.json"
                     "?iss.meta=off&iss.only=marketdata"
                     "&marketdata.columns=SECID,BOARDID,LAST,WAPRICE,MARKETPRICE")
              payload = get_json(url)
              block = payload.get("marketdata", {})
              columns = block.get("columns", [])
              rows = block.get("data", [])
              indexes = {name.upper(): i for i, name in enumerate(columns)}
              secid_i, board_i = indexes.get("SECID"), indexes.get("BOARDID")
              if secid_i is None or board_i is None:
                  raise RuntimeError(f"GLDRUB_TOM CETS response has unexpected columns: {columns}")
              match = next((row for row in rows if row[secid_i] == "GLDRUB_TOM" and row[board_i] == "CETS"), None)
              if match is None:
                  raise RuntimeError("MOEX ISS did not return GLDRUB_TOM on CETS board")
              def positive(column):
                  index = indexes.get(column)
                  if index is None or match[index] is None:
                      return None
                  try:
                      value = float(match[index])
                      return value if value > 0 else None
                  except (TypeError, ValueError):
                      return None
              live = positive("LAST") or positive("WAPRICE") or positive("MARKETPRICE")
              if live:
                  print(f"GLDRUB_TOM/CETS numeric market price verified: {live}")
                  return
              from datetime import date, timedelta
              today = date.today()
              start = today - timedelta(days=30)
              candle_url = (f"{BASE}/engines/currency/markets/selt/boards/CETS/securities/GLDRUB_TOM/candles.json"
                            f"?from={start}&till={today}&interval=24&iss.meta=off&iss.only=candles"
                            "&candles.columns=begin,close")
              candle_payload = get_json(candle_url)
              candle_block = candle_payload.get("candles", {})
              candle_columns = candle_block.get("columns", [])
              candle_rows = candle_block.get("data", [])
              close_i = {name.lower(): i for i, name in enumerate(candle_columns)}.get("close")
              valid = []
              for row in candle_rows:
                  if close_i is None or close_i >= len(row) or row[close_i] is None:
                      continue
                  try:
                      close = float(row[close_i])
                      if close > 0:
                          valid.append((str(row[0]), close))
                  except (TypeError, ValueError):
                      pass
              if len(valid) < 2:
                  raise RuntimeError("GLDRUB_TOM: need at least two positive daily closes to verify price change percentage")
              valid.sort(key=lambda item: item[0])
              previous_date, previous_close = valid[-2]
              latest_date, latest_close = valid[-1]
              daily_change_percent = (latest_close - previous_close) / previous_close * 100.0
              print(f"GLDRUB_TOM/CETS daily close verified: {latest_close} (date {latest_date}); previous close: {previous_close} (date {previous_date}); change: {daily_change_percent:+.4f}%")

          def verify_imoex_quote_and_candles():
              quote_url = (f"{BASE}/engines/stock/markets/index/boards/SNDX/securities/IMOEX.json"
                           "?iss.meta=off&iss.only=marketdata"
                           "&marketdata.columns=SECID,BOARDID,CURRENTVALUE,LASTVALUE,LASTCHANGE")
              payload = get_json(quote_url)
              block = payload.get("marketdata", {})
              columns = block.get("columns", [])
              rows = block.get("data", [])
              indexes = {name.upper(): i for i, name in enumerate(columns)}
              required = ("SECID", "BOARDID", "CURRENTVALUE", "LASTVALUE", "LASTCHANGE")
              missing = [name for name in required if name not in indexes]
              if missing:
                  raise RuntimeError(f"IMOEX response missing native index fields {missing}; columns={columns}")
              row = next((r for r in rows if r[indexes["SECID"]] == "IMOEX" and r[indexes["BOARDID"]] == "SNDX"), None)
              if row is None:
                  raise RuntimeError("MOEX ISS did not return IMOEX on SNDX board")
              current = row[indexes["CURRENTVALUE"]]
              previous = row[indexes["LASTVALUE"]]
              price = current if current is not None else previous
              if price is None or float(price) <= 0:
                  raise RuntimeError(f"IMOEX has no positive current or previous index value: {row}")
              print(f"IMOEX/SNDX index quote verified: current={current}, previous={previous}, last_change={row[indexes['LASTCHANGE']]}")

              from datetime import date, timedelta
              today = date.today()
              start = today - timedelta(days=45)
              candle_url = (f"{BASE}/engines/stock/markets/index/boards/SNDX/securities/IMOEX/candles.json"
                            f"?from={start}&till={today}&interval=24&iss.meta=off&iss.only=candles"
                            "&candles.columns=begin,open,high,low,close")
              candle_payload = get_json(candle_url)
              candle_block = candle_payload.get("candles", {})
              candle_columns = candle_block.get("columns", [])
              candle_rows = candle_block.get("data", [])
              candle_indexes = {name.lower(): i for i, name in enumerate(candle_columns)}
              if not candle_rows or any(name not in candle_indexes for name in ("begin", "open", "high", "low", "close")):
                  raise RuntimeError(f"IMOEX daily candles missing or malformed: columns={candle_columns}, rows={len(candle_rows)}")
              valid = 0
              for candle in candle_rows:
                  try:
                      values = [float(candle[candle_indexes[name]]) for name in ("open", "high", "low", "close")]
                      if all(value > 0 for value in values) and values[1] >= max(values[0], values[3]) and values[2] <= min(values[0], values[3]):
                          valid += 1
                  except (TypeError, ValueError, IndexError):
                      continue
              if valid == 0:
                  raise RuntimeError("IMOEX daily candles response contains no valid OHLC rows")
              print(f"IMOEX/SNDX daily candles verified: valid_ohlc_rows={valid}")

          def verify_cbr_currency_history():
              from datetime import date, timedelta
              from xml.etree import ElementTree
              end = date.today()
              start = end - timedelta(days=35)
              for code, label in (("R01235", "USD/RUB"), ("R01239", "EUR/RUB")):
                  url = ("https://www.cbr.ru/scripts/XML_dynamic.asp?date_req1=" +
                         start.strftime("%d/%m/%Y") + "&date_req2=" + end.strftime("%d/%m/%Y") +
                         "&VAL_NM_RQ=" + code)
                  request = Request(url, headers={"User-Agent": "MyCapital-CI/1.0"})
                  with urlopen(request, timeout=25) as response:
                      root = ElementTree.fromstring(response.read())
                  rates = []
                  for record in root.findall("Record"):
                      try:
                          day = record.attrib["Date"]
                          value = float(record.findtext("Value", "").replace(",", "."))
                          if value > 0:
                              rates.append((day, value))
                      except (KeyError, TypeError, ValueError):
                          continue
                  if len(rates) < 2:
                      raise RuntimeError(f"{label}: CBR dynamic history returned fewer than two valid daily rates")
                  print(f"{label}: CBR daily history verified, rows={len(rates)}, range={rates[0][0]}..{rates[-1][0]}")

          def verify_gold_daily_ohlc():
              from datetime import date, timedelta
              end = date.today()
              start = end - timedelta(days=90)
              url = (f"{BASE}/engines/currency/markets/selt/boards/CETS/securities/GLDRUB_TOM/candles.json"
                     f"?from={start}&till={end}&interval=24&start=0&limit=500&iss.meta=off&iss.only=candles"
                     "&candles.columns=begin,open,high,low,close")
              payload = get_json(url)
              block = payload.get("candles", {})
              columns = block.get("columns", [])
              rows = block.get("data", [])
              indexes = {name.lower(): i for i, name in enumerate(columns)}
              required = ("begin", "open", "high", "low", "close")
              if not rows or any(name not in indexes for name in required):
                  raise RuntimeError(f"GLDRUB_TOM/CETS OHLC history missing: columns={columns}, rows={len(rows)}")
              valid = 0
              for row in rows:
                  try:
                      o, h, l, c = [float(row[indexes[name]]) for name in ("open", "high", "low", "close")]
                      if min(o, h, l, c) > 0 and h >= max(o, c, l) and l <= min(o, c, h):
                          valid += 1
                  except (TypeError, ValueError, IndexError):
                      continue
              if valid < 2:
                  raise RuntimeError(f"GLDRUB_TOM/CETS: expected at least two valid OHLC candles, got {valid}")
              print(f"GLDRUB_TOM/CETS OHLC history verified: valid_rows={valid}")

          verify_gold_cets_price()
          verify_imoex_quote_and_candles()
          verify_cbr_currency_history()
          verify_gold_daily_ohlc()

          def fetch_board_candles(ticker, market, board):
              by_date = {}
              offset = 0
              for _ in range(50):
                  url = (f"{BASE}/engines/stock/markets/{market}/boards/{board}/securities/{ticker}/candles.json"
                         f"?from=2020-01-01&till=2026-11-18&interval=24&start={offset}&limit=500&candles.limit=500"
                         "&iss.meta=off&iss.only=candles&candles.columns=begin,close")
                  payload = get_json(url)
                  rows = payload.get("candles", {}).get("data", [])
                  if not rows:
                      break
                  for row in rows:
                      if row and row[0]:
                          by_date.setdefault(str(row[0])[:10], row)
                  if len(rows) < 500:
                      break
                  offset += len(rows)
              return by_date
          
          def verify_dividend_history(ticker):
              url = f"{BASE}/securities/{ticker}/dividends.json?iss.meta=off"
              payload = get_json(url)
              block = payload.get("dividends", {})
              columns = block.get("columns", [])
              rows = block.get("data", [])
              indexes = {name.lower(): i for i, name in enumerate(columns)}
              date_index = indexes.get("registryclosedate", indexes.get("recorddate"))
              amount_index = indexes.get("value")
              currency_index = indexes.get("currencyid")
              if date_index is None or amount_index is None:
                  raise RuntimeError(f"{ticker}: MOEX dividend history has unexpected columns: {columns}")
              valid = []
              for row in rows:
                  try:
                      date = str(row[date_index])[:10]
                      amount = float(row[amount_index])
                      currency = str(row[currency_index]).upper() if currency_index is not None and row[currency_index] else "RUB"
                      if len(date) == 10 and amount > 0 and currency == "RUB":
                          valid.append((date, amount))
                  except (TypeError, ValueError, IndexError):
                      continue
              if not valid:
                  raise RuntimeError(f"{ticker}: MOEX dividend endpoint returned no valid positive RUB records; rows={len(rows)}, columns={columns}")
              valid.sort(key=lambda item: item[0])
              print(f"{ticker}: MOEX dividend history verified, valid_rub_rows={len(valid)}, range={valid[0][0]}..{valid[-1][0]}")
              return valid

          # This is the regression check for the four issuers whose 2027
          # forecasts were reported missing or incomplete. A successful HTTP
          # response without actual dividend rows must fail the workflow.
          dividend_history = {}
          for ticker in ("TATN", "OZPH", "T", "X5"):
              try:
                  dividend_history[ticker] = verify_dividend_history(ticker)
              except Exception as exc:
                  # The ticker may have historical aliases. Resolve its ISIN
                  # and inspect every security ID attached to that same issue.
                  try:
                      # Resolve identity from the exact SECID row first. A localized
                      # description field can contain an ISIN for a related issue
                      # (notably TATN vs TATNP), so it must only be a fallback.
                      ticker_search = get_json(f"{BASE}/securities.json?q={quote(ticker, safe='')}&iss.meta=off")
                      search_block = ticker_search.get("securities", {})
                      search_columns = search_block.get("columns", [])
                      search_rows = search_block.get("data", [])
                      search_indexes = {name.lower(): i for i, name in enumerate(search_columns)}
                      secid_i = search_indexes.get("secid")
                      isin_i = search_indexes.get("isin")
                      isin = None
                      if secid_i is not None and isin_i is not None:
                          exact_rows = [row for row in search_rows
                                        if len(row) > max(secid_i, isin_i)
                                        and str(row[secid_i]).upper() == ticker.upper()]
                          isin = next((str(row[isin_i]).replace(" ", "").upper()
                                       for row in exact_rows
                                       if row[isin_i] and len(str(row[isin_i]).replace(" ", "")) == 12), None)
                      if not isin:
                          description = get_json(f"{BASE}/securities/{ticker}.json?iss.meta=off")
                          fields = description.get("description", {})
                          dcols, drows = fields.get("columns", []), fields.get("data", [])
                          name_i = next((i for i, name in enumerate(dcols)
                                         if str(name).strip().lower() in ("name", "shortname", "title")), 0)
                          value_i = next((i for i, name in enumerate(dcols)
                                          if str(name).strip().lower() in ("value", "valuepr", "description")), len(dcols) - 1)
                          for row in drows:
                              if not row:
                                  continue
                              labels = " ".join(str(cell) for cell in row if cell is not None).lower()
                              if "isin" in labels:
                                  candidates = [str(row[i]).strip() for i in (value_i, len(row)-1, name_i)
                                                if 0 <= i < len(row) and row[i] is not None]
                                  isin = next((value.replace(" ", "").upper() for value in candidates
                                               if len(value.replace(" ", "")) == 12
                                               and value.replace(" ", "").isalnum()), None)
                                  if isin:
                                      break
                      if not isin:
                          raise RuntimeError(f"ISIN not found in description columns={dcols}; direct endpoint error: {exc}")
                      related = get_json(f"{BASE}/securities.json?q={quote(isin, safe='')}&iss.meta=off")
                      sec_block = related.get("securities", {})
                      scols, srows = sec_block.get("columns", []), sec_block.get("data", [])
                      sidx = {name.lower(): i for i, name in enumerate(scols)}
                      isin_i, secid_i = sidx.get("isin"), sidx.get("secid")
                      secids = [ticker]
                      if isin_i is not None and secid_i is not None:
                          secids += [str(row[secid_i]) for row in srows
                                     if len(row) > max(isin_i, secid_i) and str(row[isin_i]).upper() == isin.upper()]
                      merged = {}
                      for secid in dict.fromkeys(secids):
                          try:
                              for date, amount in verify_dividend_history(secid):
                                  merged[(date, amount)] = (date, amount)
                          except Exception as alias_error:
                              print(f"{ticker}: alias {secid} unavailable: {alias_error}")
                      if not merged:
                          raise RuntimeError(f"no valid dividend records across aliases; direct endpoint error: {exc}")
                      dividend_history[ticker] = sorted(merged.values())
                      print(f"{ticker}: alias-resolved dividend history verified, records={len(merged)}")
                  except Exception as alias_error:
                      raise RuntimeError(f"{ticker}: dividend history verification failed: {alias_error}") from alias_error

          failures = []
          for ticker, (market, fallback_boards) in INSTRUMENTS.items():
              meta_url = f"{BASE}/securities/{ticker}.json?iss.meta=off&iss.only=boards&boards.columns=boardid,is_primary,market"
              metadata = get_json(meta_url)
              block = metadata.get("boards", {})
              columns = block.get("columns", [])
              rows = block.get("data", [])
              indexes = {name.lower(): i for i, name in enumerate(columns)}
              candidates = []
              for row in rows:
                  board_i = indexes.get("boardid")
                  if board_i is None or row[board_i] is None:
                      continue
                  market_i = indexes.get("market")
                  board_market = row[market_i] if market_i is not None else None
                  if board_market and board_market.lower() != market:
                      continue
                  primary_i = indexes.get("is_primary")
                  primary = str(row[primary_i]).lower() in ("1", "true") if primary_i is not None else False
                  candidates.append((primary, row[board_i]))
              boards = [board for _, board in sorted(candidates, key=lambda item: item[0], reverse=True)]
              boards += [board for board in fallback_boards if board not in boards]
              merged = {}
              for board in boards:
                  try:
                      board_candles = fetch_board_candles(ticker, market, board)
                  except Exception as exc:
                      print(f"{ticker}: board={board} request failed: {exc}")
                      continue
                  if board_candles:
                      dates = sorted(board_candles)
                      print(f"{ticker}: board={board}, candles={len(board_candles)}, range={dates[0]}..{dates[-1]}")
                      for date, candle in board_candles.items():
                          merged.setdefault(date, candle)
              if not merged:
                  failures.append(f"{ticker}: no daily candles on boards {boards}")
                  continue
              all_dates = sorted(merged)
              print(f"{ticker}: merged_candles={len(merged)}, range={all_dates[0]}..{all_dates[-1]}")
              if ticker == "SU26244RMFS2":
                  description = get_json(f"{BASE}/securities/{ticker}.json?iss.meta=off&iss.only=description&description.columns=name,value")
                  fields = {str(row[0]).upper(): row[1] for row in description.get("description", {}).get("data", []) if len(row) >= 2}
                  if not fields.get("FACEVALUE") and not fields.get("INITIALFACEVALUE"):
                      failures.append(f"{ticker}: face value missing from ISS description")
                  if not fields.get("FACEUNIT"):
                      failures.append(f"{ticker}: face unit missing from ISS description")
                  schedule = get_json(f"{BASE}/securities/{ticker}/bondization.json?iss.meta=off&iss.only=coupons,amortizations&limit=unlimited")
                  coupons = schedule.get("coupons", {}).get("data", [])
                  if not coupons:
                      failures.append(f"{ticker}: coupon schedule missing from ISS bondization")
                  else:
                      print(f"{ticker}: coupon_schedule_rows={len(coupons)}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("MOEX live-history smoke check passed; dividend records verified for TATN, OZPH, T and X5.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/my-capital-signing.jks
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: my-capital-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify release APK signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s' "$VERIFY_OUTPUT"
          ACTUAL="$(printf '%s' "$VERIFY_OUTPUT" | grep -i 'SHA-256 digest' | head -n 1 | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="77FE78460534AC46DA9A42B03435DEF8CC5D2D6D3CC67C7D3C6C8FD35008FD66"
          echo "APK signer SHA-256: $ACTUAL"
          test -n "$ACTUAL" || (echo "ERROR: Could not read APK signing certificate digest" && exit 1)
          test "$ACTUAL" = "$EXPECTED" || (echo "ERROR: APK signing certificate does not match the project baseline" && exit 1)
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-capital-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
