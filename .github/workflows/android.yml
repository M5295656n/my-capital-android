name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, fix/broker-zo-test-stable-2026-11-14, fix/dividend-forecast-record-date-2026-11-14, fix/dividend-history-partial-fetch-2026-11-14, feature/analytics-events-news, feature/payouts-sold-assets-analytics, feature/events-bond-rating-display, feature/sold-assets-in-portfolio, feature/issuer-logos-dividend-sector-fixes, feature/sector-details-remove-history-chart, fix/index-benchmark-cashflow-comparison, fix/index-benchmark-visual-separation, fix/benchmark-chart-and-return-history, fix/portfolio-return-match-benchmark-flow, feature/sold-assets-profit-index-periods-logos-2026-11-17, feature/mycapital-app-icon-2026-11-17, feature/target-portfolio-plan-2026-11-18, feature/operations-bottom-nav-redesign-2026-11-18, feature/home-dashboard-full-width-chart-2026-11-18, integration/mycapital-consolidation-2026-11-18, fix/market-history-board-routing-2026-11-18, refactor/codebase-audit-0.4.6-2026-11-18, fix/moex-gold-currency-quotes-2026-11-19, fix/restore-dashboard-gold-quote-2026-11-19 ]
    paths-ignore: [ 'docs/**' ]
  pull_request:
    branches: [ main, backup/stable-0.3.89-2026-11-14, fix/broker-zo-test-stable-2026-11-14, feature/sector-details-remove-history-chart, fix/index-benchmark-cashflow-comparison, fix/index-benchmark-visual-separation, fix/benchmark-chart-and-return-history, fix/dividend-history-partial-fetch-2026-11-14, integration/mycapital-consolidation-2026-11-18, fix/moex-gold-currency-quotes-2026-11-19 ]
    paths-ignore: [ 'docs/**' ]
  workflow_dispatch:

jobs:
  instrumented-filter:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether Android instrumented tests are required
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: full instrumented suite enabled."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          elif [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "New branch push: run full instrumented suite."
            exit 0
          else
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > changed-files.txt
          fi

          cat changed-files.txt
          if grep -Eiq '(^app/src/androidTest/)|(^app/schemas/)|(^app/src/(main|test)/.*(Database|Dao|Migration|Repository|Backup|Restore|Import|BrokerReport|Portfolio).*[.](kt|java)$)|(^app/src/main/.*/(database|dao|migration|backup|restore|import)/)|(^build[.]gradle([.]kts)?$)|(^gradle/libs[.]versions[.]toml$)' changed-files.txt; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Data-layer or Android integration files changed: instrumented suite enabled."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No database/import/restore integration changes: instrumented suite skipped."
          fi

  instrumented-tests:
    needs: instrumented-filter
    if: needs.instrumented-filter.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for hardware-accelerated Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run Room and broker-account instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            READY=0; for attempt in $(seq 1 36); do BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"; ACTIVITY="$(adb shell service check activity 2>/dev/null || true)"; PACKAGE="$(adb shell service check package 2>/dev/null || true)"; if [ "$BOOT" = "1" ] && echo "$ACTIVITY" | grep -q found && echo "$PACKAGE" | grep -q found; then READY=1; break; fi; echo "Android framework services are not ready yet (attempt $attempt/36)."; sleep 5; done; if [ "$READY" -ne 1 ]; then echo "Android framework did not become healthy; collecting diagnostics."; adb shell getprop || true; adb shell service list || true; exit 1; fi; echo "Android framework is ready; starting instrumented tests."
            gradle connectedDebugAndroidTest --stacktrace
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify live MOEX history for affected instruments
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          
          BASE = "https://iss.moex.com/iss"
          INSTRUMENTS = {
              "EQMX": ("shares", ["TQTF", "TQBR", "TQTD"]),
              "SBGD": ("shares", ["TQTF", "TQBR", "TQTD"]),
              "SBMM": ("shares", ["TQTF", "TQBR", "TQTD"]),
              "SU26244RMFS2": ("bonds", ["TQOB", "TQCB"]),
          }
          
          def get_json(url):
              last_error = None
              for attempt in range(3):
                  try:
                      request = Request(url, headers={"Accept": "application/json", "User-Agent": "MyCapital-CI/1.0"})
                      with urlopen(request, timeout=20) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      last_error = exc
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              raise RuntimeError(f"ISS request failed: {url}: {last_error}")
          
          def verify_gold_cets_price():
              url = (f"{BASE}/engines/currency/markets/selt/boards/CETS/securities/GLDRUB_TOM.json"
                     "?iss.meta=off&iss.only=marketdata"
                     "&marketdata.columns=SECID,BOARDID,LAST,WAPRICE,MARKETPRICE")
              payload = get_json(url)
              block = payload.get("marketdata", {})
              columns = block.get("columns", [])
              rows = block.get("data", [])
              indexes = {name.upper(): i for i, name in enumerate(columns)}
              secid_i, board_i = indexes.get("SECID"), indexes.get("BOARDID")
              if secid_i is None or board_i is None:
                  raise RuntimeError(f"GLDRUB_TOM CETS response has unexpected columns: {columns}")
              match = next((row for row in rows if row[secid_i] == "GLDRUB_TOM" and row[board_i] == "CETS"), None)
              if match is None:
                  raise RuntimeError("MOEX ISS did not return GLDRUB_TOM on CETS board")
              def positive(column):
                  index = indexes.get(column)
                  if index is None or match[index] is None:
                      return None
                  try:
                      value = float(match[index])
                      return value if value > 0 else None
                  except (TypeError, ValueError):
                      return None
              live = positive("LAST") or positive("WAPRICE") or positive("MARKETPRICE")
              if live:
                  print(f"GLDRUB_TOM/CETS numeric market price verified: {live}")
                  return
              from datetime import date, timedelta
              today = date.today()
              start = today - timedelta(days=30)
              candle_url = (f"{BASE}/engines/currency/markets/selt/boards/CETS/securities/GLDRUB_TOM/candles.json"
                            f"?from={start}&till={today}&interval=24&iss.meta=off&iss.only=candles"
                            "&candles.columns=begin,close")
              candle_payload = get_json(candle_url)
              candle_block = candle_payload.get("candles", {})
              candle_columns = candle_block.get("columns", [])
              candle_rows = candle_block.get("data", [])
              close_i = {name.lower(): i for i, name in enumerate(candle_columns)}.get("close")
              valid = []
              for row in candle_rows:
                  if close_i is None or close_i >= len(row) or row[close_i] is None:
                      continue
                  try:
                      close = float(row[close_i])
                      if close > 0:
                          valid.append((str(row[0]), close))
                  except (TypeError, ValueError):
                      pass
              if not valid:
                  raise RuntimeError("GLDRUB_TOM: no positive live price or daily candle close in last 30 days")
              latest_date, latest_close = max(valid, key=lambda item: item[0])
              print(f"GLDRUB_TOM/CETS daily candle price verified: {latest_close} (date {latest_date})")

          verify_gold_cets_price()

          def fetch_board_candles(ticker, market, board):
              by_date = {}
              offset = 0
              for _ in range(50):
                  url = (f"{BASE}/engines/stock/markets/{market}/boards/{board}/securities/{ticker}/candles.json"
                         f"?from=2020-01-01&till=2026-11-18&interval=24&start={offset}&limit=500&candles.limit=500"
                         "&iss.meta=off&iss.only=candles&candles.columns=begin,close")
                  payload = get_json(url)
                  rows = payload.get("candles", {}).get("data", [])
                  if not rows:
                      break
                  for row in rows:
                      if row and row[0]:
                          by_date.setdefault(str(row[0])[:10], row)
                  if len(rows) < 500:
                      break
                  offset += len(rows)
              return by_date
          
          failures = []
          for ticker, (market, fallback_boards) in INSTRUMENTS.items():
              meta_url = f"{BASE}/securities/{ticker}.json?iss.meta=off&iss.only=boards&boards.columns=boardid,is_primary,market"
              metadata = get_json(meta_url)
              block = metadata.get("boards", {})
              columns = block.get("columns", [])
              rows = block.get("data", [])
              indexes = {name.lower(): i for i, name in enumerate(columns)}
              candidates = []
              for row in rows:
                  board_i = indexes.get("boardid")
                  if board_i is None or row[board_i] is None:
                      continue
                  market_i = indexes.get("market")
                  board_market = row[market_i] if market_i is not None else None
                  if board_market and board_market.lower() != market:
                      continue
                  primary_i = indexes.get("is_primary")
                  primary = str(row[primary_i]).lower() in ("1", "true") if primary_i is not None else False
                  candidates.append((primary, row[board_i]))
              boards = [board for _, board in sorted(candidates, key=lambda item: item[0], reverse=True)]
              boards += [board for board in fallback_boards if board not in boards]
              merged = {}
              for board in boards:
                  try:
                      board_candles = fetch_board_candles(ticker, market, board)
                  except Exception as exc:
                      print(f"{ticker}: board={board} request failed: {exc}")
                      continue
                  if board_candles:
                      dates = sorted(board_candles)
                      print(f"{ticker}: board={board}, candles={len(board_candles)}, range={dates[0]}..{dates[-1]}")
                      for date, candle in board_candles.items():
                          merged.setdefault(date, candle)
              if not merged:
                  failures.append(f"{ticker}: no daily candles on boards {boards}")
                  continue
              all_dates = sorted(merged)
              print(f"{ticker}: merged_candles={len(merged)}, range={all_dates[0]}..{all_dates[-1]}")
              if ticker == "SU26244RMFS2":
                  description = get_json(f"{BASE}/securities/{ticker}.json?iss.meta=off&iss.only=description&description.columns=name,value")
                  fields = {str(row[0]).upper(): row[1] for row in description.get("description", {}).get("data", []) if len(row) >= 2}
                  if not fields.get("FACEVALUE") and not fields.get("INITIALFACEVALUE"):
                      failures.append(f"{ticker}: face value missing from ISS description")
                  if not fields.get("FACEUNIT"):
                      failures.append(f"{ticker}: face unit missing from ISS description")
                  schedule = get_json(f"{BASE}/securities/{ticker}/bondization.json?iss.meta=off&iss.only=coupons,amortizations&limit=unlimited")
                  coupons = schedule.get("coupons", {}).get("data", [])
                  if not coupons:
                      failures.append(f"{ticker}: coupon schedule missing from ISS bondization")
                  else:
                      print(f"{ticker}: coupon_schedule_rows={len(coupons)}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("MOEX live-history smoke check passed for all four instruments.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/my-capital-signing.jks
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: my-capital-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify release APK signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s' "$VERIFY_OUTPUT"
          ACTUAL="$(printf '%s' "$VERIFY_OUTPUT" | grep -i 'SHA-256 digest' | head -n 1 | sed 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="77FE78460534AC46DA9A42B03435DEF8CC5D2D6D3CC67C7D3C6C8FD35008FD66"
          echo "APK signer SHA-256: $ACTUAL"
          test -n "$ACTUAL" || (echo "ERROR: Could not read APK signing certificate digest" && exit 1)
          test "$ACTUAL" = "$EXPECTED" || (echo "ERROR: APK signing certificate does not match the project baseline" && exit 1)
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-capital-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
